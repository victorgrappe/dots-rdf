# Fuseki access control (Apache Shiro).
#
# Local development only: everything is open, including the admin API under /$/
# that the web UI needs. Fuseki's default restricts /$/** to localhost, which
# from inside a container excludes the host's browser. ../docker-compose.yml
# publishes the port on 127.0.0.1 only, so the server is not reachable from
# the network.

[main]
ssl.enabled = false

[urls]
/$/** = anon
/**   = anon
