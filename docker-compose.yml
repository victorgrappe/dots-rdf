services:
  fuseki:
    build: ./jena
    image: dots-fuseki
    container_name: dots-fuseki
    ports:
      # Bound to localhost only: jena/shiro.ini leaves the admin API open.
      - "127.0.0.1:3030:3030"
    volumes:
      - ./jena/config.ttl:/fuseki/config.ttl:ro
      - ./jena/shiro.ini:/fuseki/run/shiro.ini:ro
      - ./ttl:/data/ttl:ro
      - ./shacl:/data/shacl:ro
    restart: unless-stopped
