services:
  fuseki:
    build: ./jena
    image: peano-fuseki
    container_name: peano-fuseki
    ports:
      # Bound to localhost only: jena/shiro.ini leaves the admin API open.
      - "127.0.0.1:3030:3030"
    volumes:
      - ./jena/config.ttl:/fuseki/config.ttl:ro
      - ./jena/shiro.ini:/fuseki/run/shiro.ini:ro
      - ./graph:/data/graph:ro
    restart: unless-stopped
