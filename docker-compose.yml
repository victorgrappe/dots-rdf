services:
  fuseki:
    build: .
    image: dots-fuseki
    container_name: dots-fuseki
    ports:
      # Bound to localhost only: shiro.ini leaves the admin API open.
      - "127.0.0.1:3030:3030"
    volumes:
      - ./config.ttl:/fuseki/config.ttl:ro
      - ./shiro.ini:/fuseki/run/shiro.ini:ro
      - ../turtle:/data/turtle:ro
    restart: unless-stopped
